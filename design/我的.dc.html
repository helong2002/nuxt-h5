<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#dfe9f5}
body{font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0b7ce6;text-decoration:none}
a:hover{color:#0966c2}
</style>
</helmet>
<div class="max-w-[430px] mx-auto min-h-screen relative pb-[76px] bg-gradient-to-b from-[#eef4fb] to-[#f0f5fb]" data-screen-label="我的">
  <!-- 顶部栏 van-nav-bar -->
  <header class="bg-white px-3.5 py-3 flex items-center relative">
    <a href="首页.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5 L8 12 L15 19" stroke="#12233d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <img src="assets/logo.png" alt="TokyoDoor" class="h-8 w-auto absolute left-1/2 -translate-x-1/2">
    <span class="ml-auto flex items-center gap-2">
      <span class="flex items-center gap-1 bg-[#eef4fb] rounded-full px-2.5 py-1 text-[11px] text-[#3d5573]"><i class="w-[7px] h-[7px] rounded-full bg-[#e02929]"></i>¥1 ≈ NT$0.21</span>
      <img src="assets/ic-menu.png" alt="選單" class="h-7 w-auto">
    </span>
  </header>

  <!-- 用户卡 -->
  <section class="mx-3 mt-3 rounded-2xl p-4 relative overflow-hidden bg-gradient-to-r from-[#0b6fdc] to-[#1287ec] shadow-[0_8px_24px_rgba(11,80,180,.3)]">
    <i class="absolute -right-6 -bottom-10 w-44 h-44 rounded-full bg-white/8 border-[10px] border-white/10"></i>
    <div class="flex items-center gap-3.5 relative">
      <img src="assets/me-avatar.png" alt="頭像" class="w-[74px] h-[74px] rounded-full object-cover border-[3px] border-white/60 shrink-0">
      <div class="min-w-0">
        <div class="flex items-center gap-2"><b class="text-white text-[20px] font-black">紫小鶴</b><span class="text-[11px] text-white border border-white/50 rounded-full px-2 py-0.5">一般會員</span></div>
        <div class="text-[12px] text-[#cfe4fb] mt-1.5">帳號 ID:TD12345678</div>
        <div class="text-[12px] text-[#cfe4fb] mt-0.5">mail@tokyodoor.tw</div>
      </div>
      <div class="ml-auto text-right shrink-0">
        <div class="text-[11px] text-[#cfe4fb]">我的餘額</div>
        <b class="text-white text-[20px] font-black">NT$ 2,450</b>
        <button class="block ml-auto mt-1.5 bg-white text-[#0b7ce6] text-[13px] font-bold rounded-xl px-4 py-1.5 border-none" style="font-family:'Noto Sans TC',sans-serif">儲值</button>
      </div>
    </div>
  </section>

  <!-- 四宫格统计 -->
  <section class="mx-3 mt-3 bg-white rounded-2xl p-3 grid grid-cols-4 gap-2">
    <a href="优惠券中心.dc.html" class="bg-[#fdf6e8] rounded-xl py-3 text-center"><div class="text-[13px] text-[#8a6a3a]">優惠券</div><div class="flex items-center justify-center gap-1.5 mt-1.5"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 6 A2 2 0 0 0 4 4 H16 A2 2 0 0 0 18 6 V9 A1.5 1.5 0 0 0 18 12 V14 A2 2 0 0 0 16 16 H4 A2 2 0 0 0 2 14 V12 A1.5 1.5 0 0 0 2 9 Z" stroke="#e0a13a" stroke-width="1.5"></path></svg><b class="text-[20px] font-black text-[#b25f10]">3</b></div></a>
    <div class="bg-[#eef4fb] rounded-xl py-3 text-center"><div class="text-[13px] text-[#3d5573]">積分</div><div class="flex items-center justify-center gap-1.5 mt-1.5"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2 L11.5 7.5 L17 8 L13 11.5 L14.5 17 L10 14 L5.5 17 L7 11.5 L3 8 L8.5 7.5 Z" stroke="#0b7ce6" stroke-width="1.5" stroke-linejoin="round"></path></svg><b class="text-[20px] font-black text-[#0b7ce6]">1,280</b></div></div>
    <div class="bg-[#fdeef2] rounded-xl py-3 text-center"><div class="text-[13px] text-[#b04a62]">喜歡</div><div class="flex items-center justify-center gap-1.5 mt-1.5"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 17 C4 12.5 2.5 9 4.5 6.5 C6.2 4.4 9 4.8 10 7 C11 4.8 13.8 4.4 15.5 6.5 C17.5 9 16 12.5 10 17 Z" stroke="#e0506e" stroke-width="1.5"></path></svg><b class="text-[20px] font-black text-[#e0506e]">12</b></div></div>
    <div class="bg-[#eef4fb] rounded-xl py-3 text-center"><div class="text-[13px] text-[#3d5573]">收藏</div><div class="flex items-center justify-center gap-1.5 mt-1.5"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2" stroke="#0b7ce6" stroke-width="1.5"></rect><path d="M3 8 H17 M7 5 V3.5 M13 5 V3.5" stroke="#0b7ce6" stroke-width="1.5"></path></svg><b class="text-[20px] font-black text-[#0b7ce6]">8</b></div></div>
  </section>

  <!-- 我的订单:图标原图 -->
  <section class="mx-3 mt-3 bg-white rounded-2xl p-4">
    <div class="flex items-center"><b class="text-[18px] font-black text-[#12233d]">我的訂單</b><a href="订单确认.dc.html" class="ml-auto text-[13px] font-medium">查看全部 ›</a></div>
    <img src="assets/me-orders1.png" alt="確認中/訂單付款/代購中/等待商家發貨/待簽收" class="w-full h-auto mt-3">
    <img src="assets/me-orders2.png" alt="倉庫處理/國際物流付款/出倉處理/出倉完成/已取消" class="w-full h-auto mt-1">
  </section>

  <!-- 菜单列表 van-cell-group -->
  <section class="mx-3 mt-3 bg-white rounded-2xl px-4 py-1">
    <div class="flex items-center gap-3.5 py-4 border-b border-[#eef4fb]"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2 L13 4 H17 A1 1 0 0 1 18 5 V9 L20 11 L18 13 V17 A1 1 0 0 1 17 18 H13 L11 20 L9 18 H5 A1 1 0 0 1 4 17 V13 L2 11 L4 9 V5 A1 1 0 0 1 5 4 H9 Z" stroke="#0b7ce6" stroke-width="1.5" stroke-linejoin="round"></path><circle cx="11" cy="11" r="2.6" stroke="#0b7ce6" stroke-width="1.5"></circle></svg><span class="text-[16px] text-[#12233d] font-medium">賬戶設定</span><svg class="ml-auto" width="16" height="16" viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" stroke="#9db1c7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg></div>
    <div class="flex items-center gap-3.5 py-4 border-b border-[#eef4fb]"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 13 V3 M7 6.5 L11 2.5 L15 6.5" stroke="#0b7ce6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 11 V18 H18 V11" stroke="#0b7ce6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="text-[16px] text-[#12233d] font-medium">分享開箱</span><svg class="ml-auto" width="16" height="16" viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" stroke="#9db1c7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg></div>
    <div class="flex items-center gap-3.5 py-4 border-b border-[#eef4fb]"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2 L12.5 8 L18 9 L13.5 12.5 L15 18.5 L11 15 L7 18.5 L8.5 12.5 L4 9 L9.5 8 Z" stroke="#0b7ce6" stroke-width="1.5" stroke-linejoin="round"></path><path d="M17 2 v4 M15 4 h4" stroke="#0b7ce6" stroke-width="1.5" stroke-linecap="round"></path></svg><span class="text-[16px] text-[#12233d] font-medium">積分紀錄</span><svg class="ml-auto" width="16" height="16" viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" stroke="#9db1c7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg></div>
    <div class="flex items-center gap-3.5 py-4 border-b border-[#eef4fb]"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 20 C11 20 4 14 4 8.5 A7 7 0 0 1 18 8.5 C18 14 11 20 11 20 Z" stroke="#0b7ce6" stroke-width="1.5"></path><circle cx="11" cy="8.5" r="2.4" stroke="#0b7ce6" stroke-width="1.5"></circle></svg><span class="text-[16px] text-[#12233d] font-medium">地址管理</span><svg class="ml-auto" width="16" height="16" viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" stroke="#9db1c7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg></div>
    <div class="flex items-center gap-3.5 py-4 border-b border-[#eef4fb]"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 5 C9 3 5.5 3 3.5 5 V17 C5.5 15.5 9 15.5 11 17 C13 15.5 16.5 15.5 18.5 17 V5 C16.5 3 13 3 11 5 Z M11 5 V17" stroke="#0b7ce6" stroke-width="1.5" stroke-linejoin="round"></path></svg><span class="text-[16px] text-[#12233d] font-medium">使用說明</span><svg class="ml-auto" width="16" height="16" viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" stroke="#9db1c7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg></div>
    <div class="flex items-center gap-3.5 py-4"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 12 a7 7 0 0 1 14 0 M4 12 v3 a2 2 0 0 0 2 2 h1 v-5 H4 Z M18 12 v3 a2 2 0 0 1-2 2 h-1 v-5 h3 Z" stroke="#0b7ce6" stroke-width="1.5" stroke-linejoin="round"></path></svg><span class="text-[16px] text-[#12233d] font-medium">幫助與支援</span><svg class="ml-auto" width="16" height="16" viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" stroke="#9db1c7" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg></div>
  </section>

  <!-- 客服/FAQ -->
  <div class="mx-3 mt-3 grid grid-cols-2 gap-3">
    <div class="bg-[#eaf7ec] rounded-2xl p-3.5 flex items-center gap-2.5"><span class="w-10 h-10 rounded-full bg-white flex items-center justify-center shrink-0"><span class="w-7 h-7 rounded-full bg-[#06c755] text-white text-[8px] font-black flex items-center justify-center">LINE</span></span><div><b class="text-[14px] text-[#12233d]">专属客服</b><div class="text-[11px] text-[#3f9e55] mt-0.5">LINE 即時諮詢</div></div></div>
    <div class="bg-[#e8f2fd] rounded-2xl p-3.5 flex items-center gap-2.5"><span class="w-10 h-10 rounded-full bg-white text-[#0b7ce6] font-black text-lg flex items-center justify-center shrink-0">?</span><div><b class="text-[14px] text-[#12233d]">常見問題</b><div class="text-[11px] text-[#5a7ba0] mt-0.5">快速查找解答</div></div></div>
  </div>

  <!-- 底部 TabBar van-tabbar -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-[#e6eef7] flex pt-2 pb-3 z-[60]">
    <a href="首页.dc.html" class="flex-1 text-center"><img src="assets/tab-home-off.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">首頁</span></a>
    <a href="分类.dc.html" class="flex-1 text-center"><img src="assets/tab-grid.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">分類</span></a>
    <a href="首页.dc.html" class="flex-1 text-center"><img src="assets/tab-freebuy.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">自由購</span></a>
    <a href="购物车.dc.html" class="flex-1 text-center"><img src="assets/tab-cart.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">購物車</span></a>
    <a href="我的.dc.html" class="flex-1 text-center"><img src="assets/tab-user-on.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 font-bold text-[#0b7ce6]">我的</span></a>
  </nav>
</div>
</x-dc>

</html>
