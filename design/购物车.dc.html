<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#dfe9f5}
body{font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0b7ce6;text-decoration:none}
a:hover{color:#0966c2}
</style>
</helmet>
<div class="max-w-[430px] mx-auto min-h-screen relative pb-[76px] bg-gradient-to-b from-[#eef4fb] to-[#f0f5fb]" data-screen-label="购物车">
  <!-- 顶部栏 van-nav-bar -->
  <header class="bg-white px-3.5 py-3 sticky top-0 z-50 flex items-center gap-3 shadow-[0_1px_0_rgba(11,60,120,.06)]">
    <a href="首页.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5 L8 12 L15 19" stroke="#12233d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <div>
      <div class="text-xs text-[#7a90a8]"><a href="首页.dc.html" class="text-[#7a90a8]">首頁</a> › 我的購物車</div>
      <h1 class="m-0 text-[20px] font-black text-[#12233d]">購物車 <span class="text-xs font-normal text-[#7a90a8]">共 1 件商品</span></h1>
    </div>
  </header>

  <!-- 步骤条 van-steps -->
  <div class="mx-3 mt-3 bg-white rounded-2xl px-6 py-4">
    <div class="flex items-center">
      <span class="w-9 h-9 rounded-full border-2 border-[#0b7ce6] text-[#0b7ce6] font-bold flex items-center justify-center text-sm shrink-0">1</span>
      <i class="flex-1 h-[2px] bg-[#dbe7f5]"></i>
      <span class="w-9 h-9 rounded-full border-2 border-[#dbe7f5] text-[#9db1c7] font-bold flex items-center justify-center text-sm shrink-0">2</span>
      <i class="flex-1 h-[2px] bg-[#dbe7f5]"></i>
      <span class="w-9 h-9 rounded-full border-2 border-[#dbe7f5] text-[#9db1c7] font-bold flex items-center justify-center text-sm shrink-0">3</span>
    </div>
    <div class="flex justify-between mt-2 text-center">
      <span class="text-[13px] font-bold text-[#0b7ce6] w-20 -ml-5">我的購物車</span>
      <span class="text-[13px] text-[#9db1c7] w-20">訂單確認</span>
      <span class="text-[13px] text-[#9db1c7] w-20 -mr-5">建立/付款</span>
    </div>
  </div>

  <!-- 商品组 -->
  <section class="mx-3 mt-3 bg-white rounded-2xl overflow-hidden">
    <div class="flex items-center gap-2.5 px-3.5 py-3 border-b border-[#eef4fb]">
      <span class="w-[22px] h-[22px] rounded-md bg-[#0b7ce6] flex items-center justify-center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5 L5.5 10.5 L11.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <img src="assets/logo-mercari.png" alt="mercari" class="h-7 w-auto">
    </div>
    <div class="flex items-center gap-2 px-3.5 py-2.5 border-b border-[#eef4fb]">
      <span class="w-5 h-5 rotate-45 bg-[#e02929] rounded-[4px] shrink-0 flex items-center justify-center"><i class="w-2 h-2 bg-white rounded-sm -rotate-45"></i></span>
      <span class="text-[13px] text-[#26415f]">賣家: 3児のパパ</span>
      <span class="ml-auto flex items-center gap-1.5 text-[13px] text-[#3d5573]"><i class="w-[18px] h-[18px] border-[1.5px] border-[#c8d8ea] rounded-md bg-white"></i>選購</span>
    </div>
    <div class="flex gap-3 px-3.5 py-3.5">
      <a href="商品详情.dc.html" class="shrink-0"><img src="assets/cart-bose.png" alt="" class="w-[86px] h-[86px] rounded-xl object-cover border border-[#eef4fb]"></a>
      <div class="flex-1 min-w-0">
        <div class="text-[15px] font-bold text-[#12233d] leading-snug">Bose QuietComfort 45 降噪耳機</div>
        <div class="flex items-center justify-end gap-1 mt-1.5 text-[13px] text-[#3d5573]">規格: <span class="bg-[#eef4fb] rounded-md px-2 py-0.5 text-[12px]">預設規格</span> ›</div>
        <div class="text-[13px] text-[#3d5573] mt-1.5">價格: <b class="text-[17px] font-black text-[#e02929]">¥32,000</b> <span class="text-[11px] text-[#7a90a8]">(約 NT$6,850)</span></div>
        <div class="flex items-center mt-1.5">
          <span class="text-[13px] text-[#3d5573] mr-2">數量:</span>
          <span class="flex items-center border border-[#e6eef7] rounded-lg overflow-hidden">
            <button class="w-8 h-7 bg-[#f4f8fc] text-[#3d5573] border-none">−</button>
            <span class="w-9 text-center text-[13px] font-bold text-[#12233d]">1</span>
            <button class="w-8 h-7 bg-[#f4f8fc] text-[#0b7ce6] border-none">+</button>
          </span>
          <span class="ml-auto text-[13px] text-[#12233d]">總價:<b class="font-black">¥32,000</b></span>
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-2.5 px-3.5 pb-3.5">
      <button class="bg-[#f2571f] text-white text-[13px] font-bold rounded-lg px-4 py-2 border-none" style="font-family:'Noto Sans TC',sans-serif">刪除</button>
      <button class="bg-[#f26d8d] text-white text-[13px] font-bold rounded-lg px-4 py-2 border-none" style="font-family:'Noto Sans TC',sans-serif">收藏</button>
    </div>
    <!-- 服务开关 van-switch -->
    <div class="border-t border-[#eef4fb] px-3.5 py-3 flex items-center gap-3">
      <span class="w-11 h-6 rounded-full bg-[#dbe7f5] relative shrink-0"><i class="absolute left-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow"></i></span>
      <span class="text-[14px] text-[#26415f]">入庫拍照服務 (¥0)</span>
    </div>
    <div class="px-3.5 pb-3.5 flex items-center gap-3">
      <span class="w-11 h-6 rounded-full bg-[#0b7ce6] relative shrink-0"><i class="absolute right-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow"></i></span>
      <span class="text-[14px] text-[#26415f]">入庫檢查服務 (¥500)</span>
      <svg class="ml-auto" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 10.5 L8 14.5 L16 6" stroke="#0b7ce6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </section>

  <!-- 付款明细 van-submit-bar -->
  <section class="mx-3 mt-3 bg-white rounded-2xl p-4">
    <h2 class="m-0 text-[18px] font-black text-[#12233d]">付款明細</h2>
    <div class="flex justify-between mt-3 text-[14px]"><span class="text-[#3d5573]">商品價格</span><b class="text-[#12233d]">¥32,000</b></div>
    <div class="flex justify-between mt-2.5 text-[14px]"><span class="text-[#3d5573]">代購手續費</span><span class="text-[#7a90a8]">待確認</span></div>
    <div class="flex justify-between mt-2.5 text-[14px]"><span class="text-[#3d5573]">額外服務費</span><b class="text-[#12233d]">NT$120</b></div>
    <div class="border-t border-[#eef4fb] mt-3.5 pt-3.5 flex items-end gap-2">
      <div class="flex-1">
        <div class="text-[13px] text-[#3d5573]">付款總價</div>
        <div><b class="text-[24px] font-black text-[#e02929]">NT$6,970</b> <span class="text-[11px] text-[#7a90a8]">(約 ¥32,000)</span></div>
      </div>
      <span class="flex items-center gap-1.5 border border-[#c8d8ea] rounded-xl px-3 py-2.5 text-[13px] text-[#26415f]"><i class="w-[18px] h-[18px] rounded-md bg-[#0b7ce6] flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5 L5.5 10.5 L11.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></i>全選</span>
      <a href="订单确认.dc.html" class="bg-[#0b7ce6] text-white font-bold text-[15px] rounded-xl px-5 py-3 shadow-[0_3px_8px_rgba(11,124,230,.35)]">前往結帳</a>
    </div>
  </section>

  <!-- 底部 TabBar van-tabbar -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-[#e6eef7] flex pt-2 pb-3 z-[60]">
    <a href="首页.dc.html" class="flex-1 text-center"><img src="assets/tab-home-off.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">首頁</span></a>
    <a href="分类.dc.html" class="flex-1 text-center"><img src="assets/tab-grid-off.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">分類</span></a>
    <a href="自由购.dc.html" class="flex-1 text-center"><img src="assets/tab-freebuy-off.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">自由購</span></a>
    <a href="购物车.dc.html" class="flex-1 text-center"><img src="assets/tab-cart-on.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 font-bold text-[#0b7ce6]">購物車</span></a>
    <a href="我的.dc.html" class="flex-1 text-center"><img src="assets/tab-user-off.png" alt="" class="h-[26px] w-auto mx-auto"><span class="block text-[11px] mt-0.5 text-[#7a90a8]">我的</span></a>
  </nav>
</div>
</x-dc>
</body>
</html>
